# The SQLite key store is single-writer, so the API runs as a single replica
# backed by a PersistentVolumeClaim. Horizontal scaling is applied to the
# stateless worker (see hpa.yml), not to this stateful component.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-data
  namespace: resume-tailor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: resume-tailor
  labels:
    app: api
spec:
  replicas: 1
  strategy:
    type: Recreate  # single RWO volume — never run two writers at once
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: resume-tailor-api:latest
          imagePullPolicy: Never  # image is built directly into the local cluster
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: api-data
              mountPath: /data
      volumes:
        - name: api-data
          persistentVolumeClaim:
            claimName: api-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: resume-tailor
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
