# Local development stack (Redis + API + worker + Gradio). Production runs on
# Kubernetes — see infra/k8s/.

services:

  # Redis — Celery broker and result backend.
  redis:
    image: redis:7-alpine
    container_name: resume-tailor-redis
    ports:
      - "6379:6379"
    # Cap memory and evict LRU; no persistence — job results are ephemeral.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - resume-tailor-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # API — FastAPI server.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: resume-tailor-api
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy  # wait for Redis to accept connections
    env_file:
      - .env
    environment:
      # Reach Redis by service name; reach the host's Ollama via the gateway.
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATABASE_URL: sqlite:////app/data/resume_tailor.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api-data:/app/data  # persist the SQLite key store across restarts
    networks:
      - resume-tailor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Worker — Celery task processor.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: resume-tailor-worker
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy  # API startup creates the SQLite schema
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - resume-tailor-network
    restart: unless-stopped

  # Gradio — browser UI client. Reaches the API by service name on the network.
  gradio:
    build:
      context: gradio_client/
      dockerfile: Dockerfile.gradio
    container_name: resume-tailor-gradio
    ports:
      - "7860:7860"
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    networks:
      - resume-tailor-network
    restart: unless-stopped

networks:
  # Private bridge network; services resolve each other by name.
  resume-tailor-network:
    driver: bridge

volumes:
  # Named volumes persist across restarts (but not `docker compose down -v`).
  redis-data:
  api-data:
